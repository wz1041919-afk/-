function dateKey(d = new Date()) {
  return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
}
function cents(value) {
  const s = String(value).trim();
  if (!/^\d{1,6}(\.\d{1,2})?$/.test(s)) throw new Error('请输入有效金额，最多两位小数');
  const [a, b = ''] = s.split('.');
  const n = Number(a) * 100 + Number(b.padEnd(2, '0'));
  if (n <= 0) throw new Error('金额需要大于 0');
  return n;
}
function money(n) { return (n / 100).toFixed(2); }
function sum(rows) { return rows.reduce((n, r) => n + r.cents, 0); }
function summary(rows, day) {
  const month = rows.filter(r => r.date.slice(0, 7) === day.slice(0, 7));
  const daily = rows.filter(r => r.date === day);
  const total = sum(month);
  return {
    dayTotal: money(sum(daily)), monthTotal: money(total), allTotal: money(sum(rows)),
    count: month.length, average: money(month.length ? Math.round(total / new Set(month.map(r => r.date)).size) : 0),
    categories: meals.map(label => {
      const amount = sum(month.filter(r => r.meal === label));
      return { label, amount: money(amount), percent: total ? Math.round(amount / total * 100) : 0 };
    })
  };
}
